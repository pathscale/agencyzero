# The one setting that cannot live in `Cargo.toml`: a manifest has no way to
# pass a flag to the linker, and `RUSTFLAGS` in the environment would have to be
# set by every caller.
#
# Everything else that used to be here has moved. The renderer redirect went to
# `.cargo/local-renderer.toml`, gitignored and opt-in; the usvg patch went to
# the root `Cargo.toml`, where patches belong. See AGENTS.md.

[target.'cfg(target_os = "macos")']
# `tauri-runtime` exposes WKWebView types even when the selected custom runtime
# never uses WebKit. Remove those otherwise-unused framework load commands from
# final binaries.
rustflags = ["-C", "link-arg=-Wl,-dead_strip_dylibs"]
