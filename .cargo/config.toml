[target.'cfg(target_os = "macos")']
# `tauri-runtime` exposes WKWebView types even when the selected custom runtime never uses WebKit.
# Remove those otherwise-unused framework load commands from final binaries.
rustflags = ["-C", "link-arg=-Wl,-dead_strip_dylibs"]

# LOCAL ONLY — not committed. Builds the renderer from the working checkout
# instead of the pinned rev.
#
# It lives here rather than in `Cargo.toml` because it must never be committed:
# the paths exist only on this machine, so a build anywhere else would fail. In
# the manifest it sat one `git add` away from shipping and went in three times
# in a single session. Here it is a local edit to an already-tracked file, so
# `git status` still shows it and `git diff` still explains it.
#
# Remove once ps-blitz is pushed and the revs in apps/gui/Cargo.toml name
# commits carrying these fixes.
# The renderer workspace patches usvg to an unreleased branch, and cargo only
# honours `[patch]` from the root workspace, so building it from here needs the
# same redirection. `Tree::intrinsic_dimensions` lives on no released usvg and
# `blitz-dom` calls it.
#
# The patch is version 0.48.1, so it only covers a dependent asking for ^0.48.
# One still on ^0.46 silently gets a *second* usvg rather than an error, which
# surfaces much later as a type error naming two identically-spelled types.
#
# anyrender is not patched here any more: ps-blitz takes the whole ps-anyrender
# family by git rev now, so upstream's crates are no longer in the graph.
#
# The ps-anyrender entries are the same problem one level out. ps-blitz takes
# that family by git rev; tauri-runtime-blitz still takes ps-anyrender-vello
# from crates.io. Same version, different source, so cargo builds two copies of
# ps-anyrender and `VelloWindowRenderer` implements a `WindowRenderer` that is
# not the one `BlitzApplication` asks for. Sixty type errors, all of them that.
#
# Drop these once tauri-runtime-blitz is repinned at a ps-blitz rev that carries
# the repin, and takes the same ps-anyrender.
[patch.crates-io]
usvg = { git = "https://github.com/DioxusLabs/resvg", branch = "devin/1785858271-intrinsic-dimensions" }
ps-anyrender = { git = "https://github.com/pathscale/ps-anyrender.git", rev = "0e4122bff9220b85e4e462d1c3213c24beace3ea" }
ps-anyrender-vello = { git = "https://github.com/pathscale/ps-anyrender.git", rev = "0e4122bff9220b85e4e462d1c3213c24beace3ea" }
ps-anyrender-vello-cpu = { git = "https://github.com/pathscale/ps-anyrender.git", rev = "0e4122bff9220b85e4e462d1c3213c24beace3ea" }
ps-anyrender-vello-hybrid = { git = "https://github.com/pathscale/ps-anyrender.git", rev = "0e4122bff9220b85e4e462d1c3213c24beace3ea" }

[patch."https://github.com/pathscale/ps-blitz.git"]
ps-blitz-dom = { path = "/Users/revenge/code/ps-blitz-render/packages/blitz-dom" }
ps-blitz-script = { path = "/Users/revenge/code/ps-blitz-render/packages/blitz-script" }
ps-blitz-shell = { path = "/Users/revenge/code/ps-blitz-render/packages/blitz-shell" }
ps-blitz-traits = { path = "/Users/revenge/code/ps-blitz-render/packages/blitz-traits" }

# Same local-only rule as the ps-blitz block: the working checkout, so the
# NodeId port can be built before it is pushed.
[patch."https://github.com/pathscale/tauri-runtime-blitz.git"]
tauri-runtime-blitz = { path = "/Users/revenge/code/tauri-runtime-blitz/crates/tauri-runtime-blitz" }
blitz-control-protocol = { path = "/Users/revenge/code/tauri-runtime-blitz/crates/blitz-control-protocol" }
