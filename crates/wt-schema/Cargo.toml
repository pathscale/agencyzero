[package]
name = "wt-schema"
description = "Reads `worktable!` declarations out of Rust source and reports the schema as data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# `syn` finds the `worktable!` invocations; the tokens inside them are parsed by
# this crate rather than by `syn`, because the DSL is a `macro_rules!` grammar
# and has no typed AST to borrow. Only `full` and `parsing` are needed: nothing
# here emits Rust.
syn = { version = "2", default-features = false, features = ["full", "parsing", "proc-macro", "clone-impls", "printing"] }
# `span-locations` is what makes the `//` comments above a column readable. They
# are ordinary comments, not doc attributes, so the lexer drops them entirely
# and the only way back to them is the line number of the token that followed.
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The overlay is JSON, and the test that checks it reads it the same way the
# binary does.
serde_json = "1"

[[bin]]
name = "wt-schema"
path = "src/main.rs"
