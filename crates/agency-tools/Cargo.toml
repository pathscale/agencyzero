[package]
name = "agency-tools"
description = "Headless read-only CLI over the GUI's WorkTable store"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
worktable = "=1.0.0-beta.8"
# The `worktable!` macro emits code that names these by bare path rather than
# through a re-export, so a consumer of the macro has to declare them too.
# Versions match worktable 1.0 beta's own, since a mismatch produces errors that name
# the wrong crate. Kept identical to the block in apps/gui/Cargo.toml — the
# schema files compiled here are the gui's own (see src/lib.rs).
eyre = "0.6"
rkyv = { version = "0.8.9", features = ["uuid-1"] }
derive_more = { version = "2.0.1", features = ["from", "error", "display", "debug", "into"] }
futures = "0.3"
uuid = "1"
# `fs` and `time` are what the macro-emitted load path and our retry loop call;
# declared here rather than inherited through feature unification so a leaner
# worktable release cannot silently break this crate.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stands in for Tauri's `app_config_dir()` / `app_data_dir()`: same platform
# directories, without pulling the webview stack into a headless binary.
dirs = "6"

[[bin]]
name = "agency-tools"
path = "src/main.rs"
