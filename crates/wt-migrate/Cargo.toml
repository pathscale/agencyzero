[package]
name = "wt-migrate"
description = "Carries a WorkTable store forward when a column changes"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
# The same build the app uses, by git rev.
#
# These were a registry `=1.0.0-beta.10` and a git rev of the same version:
# one number, two code bases. Rows written by this crate then carried an index
# the app could not read, which presents as "torn or corrupt persisted table"
# on a table this tool has just written from scratch.
worktable = "=1.0.0-beta.10"
# The `worktable!` and `worktable_version!` macros emit code that names these by
# bare path rather than through a re-export, so a consumer of the macros has to
# declare them too. Kept identical to the block in agency-tools and apps/gui: the
# schema files compiled here are the gui's own (see src/lib.rs).
eyre = "0.6"
rkyv = { version = "0.8.9", features = ["uuid-1"] }
derive_more = { version = "2.0.1", features = ["from", "error", "display", "debug", "into"] }
futures = "0.3"
uuid = "1"
chrono = "0.4"
# The recovery verbs read an extracted item list.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tempfile = "3"

[[bin]]
name = "wt-migrate"
path = "src/main.rs"
