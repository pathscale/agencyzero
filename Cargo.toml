[workspace]
resolver = "3"
members = [
    "apps/gui",
    "crates/core",
    "crates/mcp-proxy",
    "crates/wt-migrate",
    "crates/agency-tools",
]

[workspace.package]
version = "0.8.33"
edition = "2024"
publish = false

[workspace.dependencies]
az-core = { path = "crates/core" }

# One AgencyProxy release ships the client and the protocol together, and a
# sidecar built from a client that disagrees with the protocol fails at connect
# time rather than at build time. Both are declared here so the pair cannot
# drift: the crates inherit these, and sidecar staging asks cargo for the
# resolved version instead of re-parsing the manifest to check they match.
agency-proxy-client = "=0.1.6"
agency-proxy-protocol = "=0.1.6"

# Heavy deps are declared per-crate on purpose: only apps/gui pulls in the
# Tauri stack, so agent/proxy builds never trigger a webview toolchain build.

# Local debugging only, alongside the path overrides in apps/gui/Cargo.toml.
# `tauri-runtime-blitz` takes blitz-dom and blitz-script by path but blitz-shell
# and blitz-traits from git at the same rev. Cargo treats those as two distinct
# crates, so the same trait exists twice and `ScriptDocument` stops satisfying
# `Document`, which reads as eleven unrelated type errors inside a dependency
# nobody edited. Redirect the git source at the checkout the paths already use.
# Same reason as the ps-blitz patch below: a local checkout so the present mode
# can be switched at runtime. FIFO blocks the main thread in `present`, which
# stalls event handling for a whole refresh interval per frame.
# The hybrid backend takes `anyrender` from crates.io while the vello backend
# takes the patched git one, which gives two copies of the trait and a renderer
# that cannot satisfy it. Pin both to the same checkout.
[profile.dev]
# GUI diagnostics come from logs and backtraces. Generating full symbol tables
# for WebKit and Tauri dependencies dominated clean local check time.
debug = 0
incremental = true

[profile.test]
# Tests need assertions and line-bearing panic output, not debugger symbols.
debug = 0
incremental = true

[profile.release]
# Symbols kept, because a local build that cannot be profiled is the expensive
# option.
#
# `sample` and Instruments attribute time to symbols, so a stripped binary
# profiles as a single `???` frame: the 2026-08-10 profile took 1036 samples
# inside az-gui without naming one function in it. This was an opt-in override
# on the theory that symbols are a debugging setting, and the theory did not
# survive contact. Every intermittent stall on this app is diagnosed by
# sampling a live process, and a wedge cannot be reproduced on demand: by the
# time the missing symbols are noticed the process is gone, and getting them
# back costs a full rebuild plus however many launches it takes to catch the
# fault again. That happened twice in one session chasing a first-frame stall.
#
# This also stops the manifest disagreeing with what actually ships.
# `release.yml` and `release-experimental.yml` both already build with
# `CARGO_PROFILE_RELEASE_STRIP: "false"` and line tables, so released binaries
# have carried symbols all along and only local builds were losing them.
strip = false
# Line tables, so a sample names a file and a line rather than only a symbol.
# Full debug info would be much larger for information a profile does not use.
debug = 1
# Release runners retain `target` through rust-cache. Incremental artifacts make
# the next standard or experimental bundle reuse unchanged Tauri dependencies.
incremental = true

# Size, measured rather than guessed, and deliberately not applied.
#
# Everything below is an environment override for the same reason the profiling
# one above is: it needs no manifest edit and cannot reach a commit by accident.
#
#   CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_INCREMENTAL=false \
#     CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 CARGO_PROFILE_RELEASE_PANIC=abort \
#     cargo build --release -p az-gui --features blitz-runtime
#
# Measured 2026-08-17 on this machine, against 59.92 MB:
#
#   thin LTO + codegen-units=1, no incremental   ~47 MB    -21%   4m08s
#   the same, plus panic = "abort"                39.05 MB -34.8% 3m20s
#
# `panic = "abort"` is most of the second step and is the part that is not free:
# it removes unwinding, so a panic aborts the process rather than unwinding to a
# catch. Nothing here relies on `catch_unwind`, but the restart angel's
# behaviour on a panicking build is untested, which is why this is a recorded
# measurement and not a default.
#
# The tradeoff on the rest is build time against `incremental`, which the note
# above wants for CI cache reuse. That is the owner's call to make, not a
# tidy-up: quadrupling release build time to save 20 MB is a judgement about
# which cost is felt more often.
#
# `blitz-inspector` stays in release builds regardless. It costs size, and it is
# what made every diagnosis in this codebase's recent history possible.

# The `[patch.crates-io]` for `usvg` is gone. It redirected at a DioxusLabs
# branch for `Tree::intrinsic_dimensions`, which lived on no released usvg at
# the time. The published `ps-anyrender-svg` now depends on `ps-usvg` directly,
# so nothing in the graph asks for plain `usvg` any more and cargo reported the
# patch as "not used in the crate graph". A patch that matches nothing is not
# inert: it is a git source in the manifest, which is what stops this workspace
# from being publishable and what put a second usvg in the graph when a
# dependent asked for a range it did not cover.
