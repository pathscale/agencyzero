[workspace]
resolver = "3"
members = [
    "apps/gui",
    "crates/blitz-bench",
    "crates/core",
    "crates/mcp-proxy",
    "crates/wt-migrate",
    "crates/agency-tools",
]

[workspace.package]
version = "0.5.11"
edition = "2024"
publish = false

[workspace.dependencies]
az-core = { path = "crates/core" }

# Heavy deps are declared per-crate on purpose: only apps/gui pulls in the
# Tauri stack, so agent/proxy builds never trigger a webview toolchain build.

# Local debugging only, alongside the path overrides in apps/gui/Cargo.toml.
# `tauri-runtime-blitz` takes blitz-dom and blitz-script by path but blitz-shell
# and blitz-traits from git at the same rev. Cargo treats those as two distinct
# crates, so the same trait exists twice and `ScriptDocument` stops satisfying
# `Document`, which reads as eleven unrelated type errors inside a dependency
# nobody edited. Redirect the git source at the checkout the paths already use.
# Same reason as the ps-blitz patch below: a local checkout so the present mode
# can be switched at runtime. FIFO blocks the main thread in `present`, which
# stalls event handling for a whole refresh interval per frame.
# The hybrid backend takes `anyrender` from crates.io while the vello backend
# takes the patched git one, which gives two copies of the trait and a renderer
# that cannot satisfy it. Pin both to the same checkout.
[patch.crates-io]
anyrender = { package = "ps-anyrender", path = "../ps-anyrender/crates/anyrender" }

[patch."https://github.com/pathscale/ps-anyrender.git"]
anyrender = { package = "ps-anyrender", path = "../ps-anyrender/crates/anyrender" }
anyrender_vello = { package = "ps-anyrender-vello", path = "../ps-anyrender/crates/anyrender_vello" }
anyrender_vello_hybrid = { path = "../ps-anyrender/crates/anyrender_vello_hybrid" }

[patch."https://github.com/pathscale/ps-blitz.git"]
blitz-dom = { package = "ps-blitz-dom", path = "../ps-blitz-render/packages/blitz-dom" }
blitz-html = { package = "ps-blitz-html", path = "../ps-blitz-render/packages/blitz-html" }
blitz-paint = { package = "ps-blitz-paint", path = "../ps-blitz-render/packages/blitz-paint" }
blitz-script = { package = "ps-blitz-script", path = "../ps-blitz-render/packages/blitz-script" }
blitz-shell = { package = "ps-blitz-shell", path = "../ps-blitz-render/packages/blitz-shell" }
blitz-traits = { package = "ps-blitz-traits", path = "../ps-blitz-render/packages/blitz-traits" }

[profile.dev]
# GUI diagnostics come from logs and backtraces. Generating full symbol tables
# for WebKit and Tauri dependencies dominated clean local check time.
debug = 0
incremental = true

[profile.test]
# Tests need assertions and line-bearing panic output, not debugger symbols.
debug = 0
incremental = true

[profile.release]
# Symbols on purpose, for the performance work.
#
# `sample`, Instruments and any profiler attribute time to symbols. Stripped,
# the entire app collapses into one `???` frame: the 2026-08-10 profile showed
# 1036 samples inside az-gui and could not name a single function in it, while
# the allocator frames it called were perfectly legible. Flip this back when
# the hunt is over; it costs bundle size, not speed.
strip = false
debug = 1
# Release runners retain `target` through rust-cache. Incremental artifacts make
# the next standard or experimental bundle reuse unchanged Tauri dependencies.
incremental = true
