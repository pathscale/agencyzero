# What AgencyZero declares to its own agent, per Prompt Syntax 13.2.
#
# Generated from `Surface` in apps/gui/src/directives.rs and checked against it
# by a test. Edit the Rust, not this file: a capability document that drifts
# from the parser is a promise about behaviour that nothing enforces.
ps_version: "0.2.2"
conformance: "PS/Core 0.2 (reverse channel, standing promotion), partial"

standing_promotion:
  # 13.2.1 The segment delimiter. An explicit designation, never a pattern scan
  # over undifferentiated output: fenced and quoted text stays inert.
  delimiter: "<ps …> on its own line, outside fenced or quoted content"

  # 13.2.2 The live namespace and its closed verb set. An unlisted verb is
  # refused as ENTITY_NOT_FOUND rather than guessed or silently left as text.
  namespace: agency
  verbs:
    - agency:items.state
    - agency:items.add
    - agency:items.describe
    - agency:items.retire
    - agency:ask
    - agency:pr.link
    - agency:pr.retire
    - agency:issue.link
    - agency:app.restart

  # 13.2.2 Verbs and values reserved to principals above the agent.
  reserved: []

  # 13.2.3 The capability bound. `items.add(project: ...)` can write outside
  # the project a turn came from, and item ids resolve installation-wide.
  # An explicit add may also create a bare project when it names one that does
  # not exist. The process lifecycle verb is separately gated by an owner
  # setting and can affect only this application. Declared here rather than
  # left implicit.
  bound: >-
    any project in this installation's store, named by id or by name;
    items.add may create an explicitly named project inside that store;
    app.restart may affect this application process only when enabled by the owner;
    no other reach outside the store, and no other namespace is live

  arguments:
    agency:items.state: [id, status, pr]
    agency:items.add: [project, ref, title, status]
    agency:items.describe: [id, description]
    agency:items.retire: [id]
    # `text` is the question. `urgency` is critical | blocking | passive; a
    # missing or unknown value defaults to blocking. `reference` is optional
    # context: a GitHub issue URL, or a bare item id.
    agency:ask: [text, urgency, reference]
    agency:pr.link: [url, number, item]
    agency:pr.retire: [id]
    agency:issue.link: [url, item]
    # mode is disk | update. Both require an explicit owner policy; update uses
    # the signed application updater before the tiny relaunch angel is spawned.
    agency:app.restart: [mode]

  semantics:
    pr_urls_in_prose: inert
    task_manager_private_formats: none
    task_manager_creates_project_with: agency:items.add

  # 13.2.4 Trace obligations. Every directive ends in exactly one recorded
  # outcome, an unresolvable reference is ENTITY_NOT_FOUND rather than a silent
  # no-op, and the outcomes are quoted back to the agent on the following turn.
  trace:
    per_directive_outcome: true
    failure_codes:
      [ENTITY_NOT_FOUND, ENTITY_AMBIGUOUS, SYNTAX_INVALID, STATUS_INVALID, WRITE_FAILED,
      OWNER_AUTHORITY_REQUIRED, SCHEDULE_FAILED]
    surfaced_to: [agent, agent_io_panel]
    # Not yet: outcomes are text lines rather than traced events carrying the
    # segment and its provenance type. Stated because an unmet obligation that
    # is not written down reads as a met one.
    typed_events: false
