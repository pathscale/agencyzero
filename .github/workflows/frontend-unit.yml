name: Legacy frontend unit suite

# Manual while component behavior moves to ps-qa. jsdom has no layout,
# hit-testing or renderer, so this suite can catch isolated logic regressions
# but cannot decide whether a control works in the application.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Legacy frontend unit suite (non-gating)
    runs-on: ubicloud-standard-2
    timeout-minutes: 3
    defaults:
      run:
        working-directory: apps/gui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --no-save
      - run: bun run test:run
