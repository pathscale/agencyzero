name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    # Trialling Namespace on this job only. The Rust job stays on ubicloud
    # because it installs webkit2gtk through `apt-get`, so aiming it at a macOS
    # profile would fail for a reason that says nothing about the runner. This
    # job is bun and nothing else, so it runs anywhere, and its time sits next
    # to the Rust job's ubicloud time as a comparison.
    runs-on: namespace-profile-agency-tahoe
    defaults:
      run:
        working-directory: apps/gui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile: a dependency that only resolves because the lockfile
      # was ignored is a dependency nobody chose.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:run
      - run: bun run build

  rust:
    name: Rust
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4

      # The Tauri stack needs a webview toolchain to compile at all.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `tauri::generate_context!` embeds `frontendDist` at compile time, so
      # apps/gui/dist has to exist before cargo runs. It is generated, not
      # tracked, and `cargo build` does not invoke `beforeBuildCommand` —
      # only `cargo tauri build` does.
      - name: Build the frontend az-gui embeds
        working-directory: apps/gui/frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
