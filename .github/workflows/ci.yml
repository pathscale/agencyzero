name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    # Linux, like every other QA job. The Namespace profile trialled here was
    # macOS (`Operating System: macOS`, bun-darwin-aarch64) and finished in
    # 21s against ubicloud's 1m4s, but this job is typecheck, lint and a
    # bundler: nothing it does needs a Mac, and QA is the half that must stay
    # cheap because it runs on every push. The only macOS in this repository
    # is the release bundle, which cannot be built anywhere else.
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: apps/gui/frontend
    steps:
      - uses: actions/checkout@v4

      # `press` and `prepare_press` still resolve an exact semantic node; they
      # only ask ps-qa to use a person's physical pointer path. Click-away and
      # focus-preservation contracts require that path, so do not reject it as
      # raw browser/DOM control.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Resolve the declared caret ranges on every run. `--no-save` installs
      # without recreating a lockfile in the checkout.
      - run: bun install --no-save

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:ui-controls
      # Pure application and store outcomes under Solid's browser reactive
      # runtime. Rendered interactions are gated separately by QA panel.
      - run: bun run test:run
      - run: bun run build

  rust:
    name: Rust
    runs-on: ubicloud-standard-4
    env:
      # CI needs diagnostics, not debugger symbol tables. This substantially
      # shrinks compile and link work without changing which tests execute.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      # AgencyZero takes agent-abstraction by path, from a sibling checkout, so
      # a change can be made and tested across both without a publish between
      # each step. Cargo resolves that path literally, and
      # CI does not commit Cargo.lock, so the siblings have to exist before the
      # first command that resolves the graph. Without them `cargo
      # generate-lockfile` fails inside the sidecar script, before anything is
      # compiled.
      #
      # `ref` follows the branch carrying the matching change, and falls back
      # to the default branch once that merges. Do not replace these paths with
      # version requirements to make CI pass: that forces a publish before the
      # change can be tested, which is the coupling the paths exist to avoid.
      # `actions/checkout` refuses a path outside the workspace, so the
      # siblings land inside it and are moved up afterwards.
      - name: Check out agent-abstraction
        uses: actions/checkout@v4
        with:
          repository: pathscale/RustAgentAbstraction
          ref: feat/grok-headless
          path: .sibling/RustAgentAbstraction

      - name: Put the sibling checkouts where the paths expect them
        run: |
          mv .sibling/RustAgentAbstraction ..
          rmdir .sibling
          test -f ../RustAgentAbstraction/Cargo.toml

      - name: Check portable shell scripts
        run: /bin/sh tests/shell-scripts.sh

      # The Tauri stack needs a webview toolchain to compile at all.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `tauri::generate_context!` embeds `frontendDist` at compile time, so
      # apps/gui/dist has to exist before cargo runs. It is generated, not
      # tracked, and `cargo build` does not invoke `beforeBuildCommand` —
      # only `cargo tauri build` does.
      - name: Build the frontend az-gui embeds
        working-directory: apps/gui/frontend
        run: |
          bun install --no-save
          bun run build

      - name: Build the AgencyProxy sidecar
        run: scripts/stage-agency-proxy-sidecar.sh

      - name: Build the WorkTable v2 migration reader
        run: scripts/stage-wt-v2-reader-sidecar.sh

      # `--all` reaches into path dependencies, so it would check the sibling
      # checkouts' formatting as well as this repository's. Those repositories
      # gate their own formatting in their own CI. `--package` per workspace
      # member keeps this job answering for this repository only.
      - run: cargo fmt --check -p az-gui -p az-core -p az-mcp-proxy -p wt-migrate -p agency-tools
      # Blitz is currently a macOS preview runtime. Enabling every feature on
      # this Linux runner asks it to implement Tauri's GTK-only runtime traits,
      # which is separate portability work rather than Linux CI for AgencyZero.
      - run: cargo clippy --workspace --all-targets --no-default-features --features experimental,webview-runtime -- -D warnings
      - run: cargo test --workspace --no-default-features --features experimental,webview-runtime
