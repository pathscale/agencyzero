name: QA panel

# Manual only, never on push or pull_request.
#
# This job drives a real window: it launches the app, resolves controls through
# the semantic tree and activates exact node ids. That needs macOS, which the rest
# of CI deliberately avoids (see the note in ci.yml, where the only macOS is the
# release bundle), and it takes minutes rather than seconds. Running it on every
# push would make the expensive half of CI the common case.
#
# It is also not yet a gate. The 23 outcome checks do not cover every control,
# so a red run here means "look at this", not "the branch is broken".
# `continue-on-error` keeps it advisory until the inventory in
# tests/ps-qa/issues.md says otherwise.
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Check group to run (blank = all 23). One of: icons hover status sections tasklog rename dialog delete settings'
        required: false
        type: string
      cover:
        description: 'Also sweep every surface and report coverage buckets'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel checks
    # macOS because the harness needs a window server. There is no headless
    # path: the whole point is to ask the compositor what it actually drew.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The Rust binary embeds apps/gui/dist, which cargo does not build or
      # track. Build it explicitly so the audit never runs against a stale or
      # absent frontend.
      - name: Build the frontend az-gui embeds
        working-directory: apps/gui/frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Stage the agency-proxy sidecar
        run: scripts/stage-agency-proxy-sidecar.sh

      # blitz-inspector, NOT blitz-runtime: a blitz-runtime build answers every
      # inspector call with diagnosticsUnavailable, so the run would fail with
      # every check unable to see anything rather than with a real verdict.
      - name: Build az-gui with the inspector
        # Pin the unreleased macOS glass availability fix from TRB PR 30. Both
        # packages share one workspace revision; remove these two overrides
        # after 0.1.3 is published and recorded in Cargo.lock.
        run: >-
          cargo
          --config 'patch.crates-io.tauri-runtime-blitz.git="https://github.com/pathscale/tauri-runtime-blitz.git"'
          --config 'patch.crates-io.tauri-runtime-blitz.rev="e3c379d"'
          --config 'patch.crates-io.blitz-control-protocol.git="https://github.com/pathscale/tauri-runtime-blitz.git"'
          --config 'patch.crates-io.blitz-control-protocol.rev="e3c379d"'
          build --features blitz-inspector --bin az-gui

      # Pin the semantic-action implementation until ps-qa 0.3 is published.
      # Application names and expectations remain in this repository; the
      # harness commit supplies only generic node-addressed behavior.
      - name: Install ps-qa
        run: >-
          cargo install ps-qa
          --git https://github.com/pathscale/ps-qa.git
          --rev 476220a

      - name: Scrubber unit tests
        run: >-
          cargo
          --config 'patch.crates-io.tauri-runtime-blitz.git="https://github.com/pathscale/tauri-runtime-blitz.git"'
          --config 'patch.crates-io.tauri-runtime-blitz.rev="e3c379d"'
          --config 'patch.crates-io.blitz-control-protocol.git="https://github.com/pathscale/tauri-runtime-blitz.git"'
          --config 'patch.crates-io.blitz-control-protocol.rev="e3c379d"'
          test --bin az-gui --features blitz-inspector qa_profile

      # From the committed archive, so a run measures what is in the tree. The
      # profile is single-writer and every check mutates it, so this restores a
      # throwaway copy rather than working on the archive.
      - name: Restore the QA profile
        run: scripts/qa-profile-restore.sh /tmp/qa-profile-db

      - name: Launch the app
        run: |
          export TAURI_BLITZ_CONTROL_DESCRIPTOR="$PWD/target/blitz-control.json"
          AZ_DATA_DIR=/tmp/qa-profile-db \
            ./target/debug/az-gui > /tmp/az-qa.log 2>&1 &
          echo $! > /tmp/az-qa.pid
          # The window has to exist before anything can be pressed. Poll for the
          # descriptor rather than sleeping a fixed time, which is the
          # difference between a slow runner passing and a slow runner
          # reporting every control as missing.
          for _ in $(seq 1 60); do
            [ -f "$PWD/target/blitz-control.json" ] && break
            sleep 2
          done
          if [ ! -f "$PWD/target/blitz-control.json" ]; then
            echo "the app never wrote its control descriptor" >&2
            tail -40 /tmp/az-qa.log >&2
            exit 1
          fi
          sleep 10

      - name: Verify tree integrity
        run: |
          ps-qa find '*' --role button --hidden --painted --count \
            --descriptor "$PWD/target/blitz-control.json" 2>&1 | tee /tmp/hidden-painted.txt
          if ! grep -Eq '^matched:[[:space:]]*0$' /tmp/hidden-painted.txt; then
            echo "hidden painted buttons make semantic audit results ambiguous" >&2
            exit 1
          fi
          ps-qa ghost \
            --descriptor "$PWD/target/blitz-control.json" 2>&1 | tee /tmp/ghost.txt

      - name: Run the checks
        id: checks
        continue-on-error: true
        run: |
          # Run from the repository root: the harness discovers ps-qa.ron and
          # tests/ps-qa/ relative to the working directory.
          ps-qa qa ${{ inputs.group }} \
            --descriptor "$PWD/target/blitz-control.json" 2>&1 | tee /tmp/qa.txt

      - name: Coverage
        if: ${{ inputs.cover }}
        continue-on-error: true
        run: |
          for surface in home project settings analytics; do
            ps-qa cover "$surface" \
              --descriptor "$PWD/target/blitz-control.json" 2>&1 || true
          done | tee /tmp/cover.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Panel checks'
            echo
            echo '```'
            tail -20 /tmp/qa.txt 2>/dev/null || echo 'the run produced no output'
            echo '```'
            if [ -f /tmp/cover.txt ]; then
              echo
              echo '## Coverage'
              echo
              echo '```'
              cat /tmp/cover.txt
              echo '```'
              echo
              echo 'A negative `UNACCOUNTED` means the buckets overran the total and the'
              echo 'number cannot be trusted. `swept` means a control was pressed and'
              echo 'something changed, not that the right thing changed.'
            fi
            echo
            echo 'Full inventory: `tests/ps-qa/issues.md`.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Exact PID, TERM only. A name pattern can reach another checkout and a
      # hard kill can tear the single-writer profile.
      - name: Stop the app
        if: always()
        run: |
          if [ -f /tmp/az-qa.pid ]; then
            kill -TERM "$(cat /tmp/az-qa.pid)" 2>/dev/null || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-panel-logs
          path: |
            /tmp/az-qa.log
            /tmp/hidden-painted.txt
            /tmp/ghost.txt
            /tmp/qa.txt
            /tmp/cover.txt
          if-no-files-found: ignore
