name: QA panel

# Automatic for pull requests that can change a rendered interaction, and
# manually runnable for audits of any branch.
#
# This job drives a real window: it launches the app, resolves controls through
# the semantic tree and activates exact node ids. That needs macOS, which the rest
# of CI deliberately avoids. Path filtering keeps the expensive half focused on
# frontend and QA changes while making a UI dependency bump prove the exact
# package it resolves before that pull request can merge.
#
# Pull requests run the input-component contract groups and tree integrity.
# Manual runs can execute every declared outcome and optionally reconcile every
# control instance, keeping historical whole-application debt separate from a
# focused component regression gate.
on:
  pull_request:
    paths:
      - '.github/workflows/qa-panel.yml'
      - 'apps/gui/frontend/bun.lock'
      - 'apps/gui/frontend/package.json'
      - 'apps/gui/frontend/src/**'
      - 'ps-qa.ron'
      - 'scripts/qa-profile-restore.sh'
      - 'scripts/qa-run-groups.sh'
      - 'tests/ps-qa/**'
  workflow_dispatch:
    inputs:
      group:
        description: 'Space-separated check groups (blank = all declared outcomes).'
        required: false
        type: string
      cover:
        description: 'Also inventory and activate every eligible semantic control'
        required: false
        type: boolean
        default: false
      lifecycle:
        description: 'Also verify inspection-disable as the final semantic action'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel checks
    # macOS because the harness needs a window server. There is no headless
    # path: the whole point is to ask the compositor what it actually drew.
    runs-on: macos-14
    # Compilation is outside the measured interaction sweep. Keep enough room
    # for a cold release build and cleanup, but never leave a stale QA process
    # occupying a runner for an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Validate an unpublished UI change in the consuming native application
      # before asking for a package release. Remove this checkout/overlay once
      # the proven UI commit is published and the dependency is advanced.
      - uses: actions/checkout@v4
        with:
          repository: pathscale/ui
          ref: 5521cee8dba32138d991af7fe5bb8f2840851fd4
          path: ui-under-test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build the unpublished UI package under test
        working-directory: ui-under-test
        run: |
          bun install --frozen-lockfile
          bun run build

      # Application names and expectations remain in this repository; the
      # harness supplies only generic node-addressed behavior. Parse them before
      # spending minutes building or launching an app with an incompatible
      # harness release.
      - name: Install ps-qa
        run: cargo install ps-qa --git https://github.com/pathscale/ps-qa --rev 180ee1168b0d0a5ee204524942a74c641435eaf3 --locked

      - name: Validate the QA profile and outcome manifest
        run: ps-qa --app ps-qa.ron list --checks tests/ps-qa

      # The Rust binary embeds apps/gui/dist, which cargo does not build or
      # track. Build it explicitly so the audit never runs against a stale or
      # absent frontend.
      - name: Build the frontend az-gui embeds
        working-directory: apps/gui/frontend
        run: |
          bun install --frozen-lockfile
          cp -R ../../../ui-under-test/dist/. node_modules/@pathscale/ui/dist/
          bun run build

      - name: Stage the agency-proxy sidecar
        run: scripts/stage-agency-proxy-sidecar.sh

      # blitz-inspector, NOT blitz-runtime: a blitz-runtime build answers every
      # inspector call with diagnosticsUnavailable, so the run would fail with
      # every check unable to see anything rather than with a real verdict.
      - name: Build az-gui with the inspector
        run: cargo build --release --features blitz-inspector,experimental --bin az-gui

      # From the committed archive, so a run measures what is in the tree. The
      # profile is single-writer and every check mutates it, so this restores a
      # throwaway copy rather than working on the archive.
      - name: Restore the QA profile
        run: scripts/qa-profile-restore.sh /tmp/qa-profile-db

      # Select is used for provider-session imports, which are intentionally
      # absent on a clean runner. Two synthetic read-only rollouts make the
      # real component deterministic without borrowing a developer's store.
      - name: Stage provider sessions for input-control QA
        run: |
          mkdir -p /tmp/qa-home/.codex/sessions
          printf '%s\n' \
            '{"type":"session_meta","timestamp":"2026-08-26T00:00:00Z","payload":{"id":"ps-qa-select-new","cwd":"/tmp"}}' \
            '{"type":"event_msg","timestamp":"2026-08-26T00:00:01Z","payload":{"type":"user_message","message":"ps-qa newer select fixture"}}' \
            > /tmp/qa-home/.codex/sessions/rollout-ps-qa-select-new.jsonl
          printf '%s\n' \
            '{"type":"session_meta","timestamp":"2026-08-25T00:00:00Z","payload":{"id":"ps-qa-select-old","cwd":"/tmp"}}' \
            '{"type":"event_msg","timestamp":"2026-08-25T00:00:01Z","payload":{"type":"user_message","message":"ps-qa older select fixture"}}' \
            > /tmp/qa-home/.codex/sessions/rollout-ps-qa-select-old.jsonl

      - name: Launch the app
        run: |
          launch_app() {
            HOME=/tmp/qa-home AZ_DATA_DIR=/tmp/qa-profile-db \
              ./target/release/az-gui --blitz-control > /tmp/az-qa.log 2>&1 &
            echo $! > /tmp/az-qa.pid
          }
          visible_surface() {
            for _ in $(seq 1 20); do
              if ps-qa find 'Home' --role button --limit 1 > /tmp/attach.txt 2>&1 && \
                grep -Eq '^matched:[[:space:]]*[1-9]' /tmp/attach.txt; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          launch_app
          if ! visible_surface; then
            # A macOS hosted runner can occasionally create the control socket
            # without assigning the native window a monitor. That is not an
            # application verdict. Restart once from the pristine fixture and
            # require a real visible surface before any outcome can run.
            kill "$(cat /tmp/az-qa.pid)" 2>/dev/null || true
            wait "$(cat /tmp/az-qa.pid)" 2>/dev/null || true
            scripts/qa-profile-restore.sh /tmp/qa-profile-db
            launch_app
          fi
          if ! visible_surface; then
            echo "ps-qa could not reach a visible application surface" >&2
            cat /tmp/attach.txt >&2
            tail -80 /tmp/az-qa.log >&2
            exit 1
          fi

      - name: Verify tree integrity
        id: integrity
        continue-on-error: true
        run: |
          set -o pipefail
          integrity=0
          ps-qa find '*' --role button --hidden --painted \
            2>&1 | tee /tmp/hidden-painted.txt || integrity=1
          if ! grep -Eq '^matched:[[:space:]]*0$' /tmp/hidden-painted.txt; then
            echo "hidden painted buttons make semantic audit results ambiguous" >&2
            integrity=1
          fi
          ps-qa ghost 2>&1 | tee /tmp/ghost.txt || integrity=1
          exit "$integrity"

      - name: Run the focused input checks
        id: checks
        continue-on-error: true
        timeout-minutes: 3
        env:
          QA_GROUPS: ${{ github.event_name == 'pull_request' && 'rename select' || inputs.group }}
        run: |
          set -o pipefail
          # One process, ordered semantic preconditions. Blank means all groups.
          scripts/qa-run-groups.sh

      # Keep Select failures self-diagnosing. These are semantic queries through
      # the native inspector: they distinguish a closed/hidden popup from one
      # whose listbox never reached the renderer at all.
      - name: Diagnose Select semantic state
        if: always()
        continue-on-error: true
        run: |
          ps-qa find '@ui-select-trigger' --limit 10
          ps-qa find '*' --role listbox --limit 10
          ps-qa find '*' --role option --limit 20

      # The expensive complete audit runs exactly once, after the focused
      # regression is green, against the same compiled app and restored store.
      - name: Run the complete behavior audit
        id: full
        if: ${{ steps.checks.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          QA_GROUPS: ''
        run: |
          set -o pipefail
          QA_LOG=/tmp/qa-full.txt scripts/qa-run-groups.sh

      # Inventory visits every surface after the timed outcomes so the same
      # app process carries cross-component state.
      - name: Reachability inventory
        id: inventory
        if: ${{ (github.event_name == 'pull_request' && steps.full.outcome == 'success') || inputs.cover }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          ps-qa inventory 2>&1 | tee /tmp/cover.txt
          components="$(awk '/^components:/ { print $2; exit }' /tmp/cover.txt)"
          unverified="$(awk '/^unverified:/ { print $2; exit }' /tmp/cover.txt)"
          isolated="$(awk '/^isolated:/ { print $2; exit }' /tmp/cover.txt)"
          # Repeated table rows are one component family. Dedicated checks
          # prove representative rows, Show more, and reveal, so inventory
          # keeps a conservative floor below the observed 335-control baseline.
          test "${components:-0}" -ge 300
          test "${unverified:-999}" -le "${isolated:-0}"

      - name: Reconcile every inventoried control
        id: sweep
        if: ${{ (github.event_name == 'pull_request' && steps.full.outcome == 'success') || inputs.cover }}
        continue-on-error: true
        run: |
          set -o pipefail
          # Reconcile the saved representative report without activating
          # duplicate instances of the same row component.
          ps-qa reconcile /tmp/cover.txt --checks tests/ps-qa \
            2>&1 | tee /tmp/sweep.txt

      - name: Verify the inspection toggle disconnects control
        id: isolated
        if: ${{ (github.event_name == 'pull_request' && steps.full.outcome == 'success') || inputs.cover || inputs.lifecycle }}
        continue-on-error: true
        run: |
          ps-qa click Settings
          sleep 2
          ps-qa click "Enable inspection and agent control" \
            > /tmp/isolated.txt 2>&1 || true
          if ps-qa nodes > /tmp/isolated-probe.txt 2>&1; then
            ps-qa click "Enable inspection and agent control" \
              >> /tmp/isolated.txt 2>&1 || true
          fi
          disconnected=0
          for _ in $(seq 1 20); do
            if ! ps-qa nodes > /tmp/isolated-probe.txt 2>&1; then
              disconnected=1
              break
            fi
            sleep 0.5
          done
          if [ "$disconnected" -ne 1 ]; then
            echo "inspection toggle left the control socket reachable" >&2
            exit 1
          fi

      # Report every red gate before failing the job. Separate `exit 1` steps
      # stopped at the first failure and silently hid later lifecycle failures.
      - name: Enforce complete QA outcome
        if: always()
        run: |
          failed=0
          for gate in \
            'tree integrity:${{ steps.integrity.outcome }}' \
            'focused input checks:${{ steps.checks.outcome }}' \
            'complete behavior audit:${{ steps.full.outcome }}' \
            'reachability inventory:${{ steps.inventory.outcome }}' \
            'semantic sweep:${{ steps.sweep.outcome }}' \
            'inspection toggle:${{ steps.isolated.outcome }}'; do
            name="${gate%%:*}"
            outcome="${gate#*:}"
            if [ "$outcome" = failure ]; then
              echo "$name failed" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Panel checks'
            echo
            echo '```'
            tail -20 /tmp/qa.txt 2>/dev/null || echo 'the run produced no output'
            echo '```'
            if [ -f /tmp/qa-full.txt ]; then
              echo
              echo '## Complete behavior audit'
              echo
              echo '```'
              tail -20 /tmp/qa-full.txt
              echo '```'
            fi
            if [ -f /tmp/cover.txt ]; then
              echo
              echo '## Coverage'
              echo
              echo '```'
              cat /tmp/cover.txt
              echo '```'
              echo
              echo '`manual` controls are native/external actions, restart controls, and authenticated provider Send/Run/Reply.'
              echo '`anonymous` controls lack an accessible name and fail semantic reachability.'
            fi
            if [ -f /tmp/sweep.txt ]; then
              echo
              echo '## Full semantic sweep'
              echo
              echo '```'
              tail -80 /tmp/sweep.txt
              echo '```'
            fi
            echo
            echo 'Full inventory: `tests/ps-qa/issues.md`.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Exact PID. Give the store ten seconds to flush after TERM, then stop a
      # genuinely wedged audit child without touching any other instance.
      - name: Stop the app
        if: always()
        run: |
          if [ -f /tmp/az-qa.pid ]; then
            audit_pid="$(cat /tmp/az-qa.pid)"
            kill -TERM "$audit_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$audit_pid" 2>/dev/null; then exit 0; fi
              sleep 0.5
            done
            kill -KILL "$audit_pid" 2>/dev/null || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-panel-logs
          path: |
            /tmp/az-qa.log
            /tmp/hidden-painted.txt
            /tmp/ghost.txt
            /tmp/qa.txt
            /tmp/qa-full.txt
            /tmp/cover.txt
            /tmp/sweep.txt
            /tmp/isolated.txt
            /tmp/isolated-probe.txt
          if-no-files-found: ignore
