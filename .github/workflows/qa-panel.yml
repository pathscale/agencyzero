name: QA panel

# Manual only, never on push or pull_request.
#
# This job drives a real window: it launches the app, resolves controls through
# the semantic tree and activates exact node ids. That needs macOS, which the rest
# of CI deliberately avoids (see the note in ci.yml, where the only macOS is the
# release bundle), and it takes minutes rather than seconds. Running it on every
# push would make the expensive half of CI the common case.
#
# The 166 declared outcomes and the tree-integrity checks are gates. Their steps
# continue long enough to collect and upload every diagnostic, then the final
# enforcement steps turn the job red. Full coverage maps every control instance
# to named outcomes and remains red while any eligible instance has none.
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Check group to run (blank = all 166).'
        required: false
        type: string
      cover:
        description: 'Also inventory and activate every eligible semantic control'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel checks
    # macOS because the harness needs a window server. There is no headless
    # path: the whole point is to ask the compositor what it actually drew.
    runs-on: macos-14
    # A full instance-level sweep drives roughly 475 controls after a 10-minute
    # build. Keep enough room for every Home row and guaranteed process cleanup.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Application names and expectations remain in this repository; the
      # harness supplies only generic node-addressed behavior. Parse them before
      # spending minutes building or launching an app with an incompatible
      # harness release.
      - name: Install ps-qa
        run: cargo install ps-qa --version 0.3.3

      - name: Validate the QA profile and outcome manifest
        run: ps-qa --app ps-qa.ron list --checks tests/ps-qa

      # The Rust binary embeds apps/gui/dist, which cargo does not build or
      # track. Build it explicitly so the audit never runs against a stale or
      # absent frontend.
      - name: Build the frontend az-gui embeds
        working-directory: apps/gui/frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Stage the agency-proxy sidecar
        run: scripts/stage-agency-proxy-sidecar.sh

      # blitz-inspector, NOT blitz-runtime: a blitz-runtime build answers every
      # inspector call with diagnosticsUnavailable, so the run would fail with
      # every check unable to see anything rather than with a real verdict.
      - name: Build az-gui with the inspector
        run: cargo build --features blitz-inspector,experimental --bin az-gui

      - name: Scrubber unit tests
        run: cargo test --bin az-gui --features blitz-inspector,experimental qa_profile

      # From the committed archive, so a run measures what is in the tree. The
      # profile is single-writer and every check mutates it, so this restores a
      # throwaway copy rather than working on the archive.
      - name: Restore the QA profile
        run: scripts/qa-profile-restore.sh /tmp/qa-profile-db

      - name: Launch the app
        run: |
          AZ_DATA_DIR=/tmp/qa-profile-db \
            ./target/debug/az-gui --blitz-control > /tmp/az-qa.log 2>&1 &
          echo $! > /tmp/az-qa.pid
          # The window has to exist before anything can be addressed. Poll the
          # CLI's normal descriptor discovery rather than creating an Agency
          # environment contract for the socket path.
          for _ in $(seq 1 60); do
            ps-qa nodes > /tmp/attach.txt 2>&1 && break
            sleep 2
          done
          if ! ps-qa nodes > /tmp/attach.txt 2>&1; then
            echo "ps-qa could not discover the app control descriptor" >&2
            cat /tmp/attach.txt >&2
            tail -40 /tmp/az-qa.log >&2
            exit 1
          fi
          sleep 10

      - name: Verify tree integrity
        id: integrity
        continue-on-error: true
        run: |
          set -o pipefail
          integrity=0
          ps-qa find '*' --role button --hidden --painted \
            2>&1 | tee /tmp/hidden-painted.txt || integrity=1
          if ! grep -Eq '^matched:[[:space:]]*0$' /tmp/hidden-painted.txt; then
            echo "hidden painted buttons make semantic audit results ambiguous" >&2
            integrity=1
          fi
          ps-qa ghost 2>&1 | tee /tmp/ghost.txt || integrity=1
          exit "$integrity"

      - name: Run the checks
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          # Run from the repository root: the harness discovers ps-qa.ron and
          # tests/ps-qa/ relative to the working directory.
          ps-qa --trace qa ${{ inputs.group }} 2>&1 | tee /tmp/qa.txt

      # Outcome checks intentionally mutate the fixture. The exhaustive pass
      # needs the committed starting state, not a project already renamed,
      # reordered, or left behind a modal by a failing check.
      - name: Restart from a clean profile for full coverage
        if: ${{ inputs.cover }}
        run: |
          old_pid="$(cat /tmp/az-qa.pid)"
          kill -TERM "$old_pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            if ! kill -0 "$old_pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if kill -0 "$old_pid" 2>/dev/null; then
            kill -KILL "$old_pid"
            for _ in $(seq 1 20); do
              if ! kill -0 "$old_pid" 2>/dev/null; then break; fi
              sleep 0.1
            done
          fi
          if kill -0 "$old_pid" 2>/dev/null; then
            echo "audit instance $old_pid did not exit after KILL" >&2
            exit 1
          fi

          scripts/qa-profile-restore.sh /tmp/qa-profile-db
          AZ_DATA_DIR=/tmp/qa-profile-db \
            ./target/debug/az-gui --blitz-control >> /tmp/az-qa.log 2>&1 &
          echo $! > /tmp/az-qa.pid
          for _ in $(seq 1 60); do
            ps-qa nodes > /tmp/reattach.txt 2>&1 && break
            sleep 2
          done
          if ! ps-qa nodes > /tmp/reattach.txt 2>&1; then
            echo "ps-qa could not reattach to the clean audit instance" >&2
            cat /tmp/reattach.txt >&2
            tail -40 /tmp/az-qa.log >&2
            exit 1
          fi
          sleep 10

      - name: Reachability inventory
        id: inventory
        if: ${{ inputs.cover }}
        continue-on-error: true
        run: |
          set -o pipefail
          # Reachability without a named behavioral verdict is incomplete
          # coverage, not a pass. Isolated controls are proven after the
          # ordinary sweep because their success closes the control socket.
          ps-qa inventory 2>&1 | tee /tmp/cover.txt
          unverified="$(awk '/^unverified:/ { print $2; exit }' /tmp/cover.txt)"
          isolated="$(awk '/^isolated:/ { print $2; exit }' /tmp/cover.txt)"
          test "${unverified:-999}" -le "${isolated:-0}"

      - name: Exercise every eligible control
        id: sweep
        if: ${{ inputs.cover }}
        continue-on-error: true
        run: |
          set -o pipefail
          ps-qa --trace cover 2>&1 | tee /tmp/sweep.txt

      - name: Restart clean for isolated controls
        if: ${{ inputs.cover }}
        run: |
          old_pid="$(cat /tmp/az-qa.pid)"
          kill -TERM "$old_pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            if ! kill -0 "$old_pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if kill -0 "$old_pid" 2>/dev/null; then kill -KILL "$old_pid"; fi

          scripts/qa-profile-restore.sh /tmp/qa-profile-db
          AZ_DATA_DIR=/tmp/qa-profile-db \
            ./target/debug/az-gui --blitz-control >> /tmp/az-qa.log 2>&1 &
          echo $! > /tmp/az-qa.pid
          for _ in $(seq 1 60); do
            ps-qa nodes > /tmp/isolated-attach.txt 2>&1 && break
            sleep 2
          done
          ps-qa nodes > /tmp/isolated-attach.txt 2>&1
          sleep 10

      - name: Verify the inspection toggle disconnects control
        id: isolated
        if: ${{ inputs.cover }}
        continue-on-error: true
        run: |
          ps-qa click Settings
          sleep 2
          ps-qa click "Enable inspection and agent control" \
            > /tmp/isolated.txt 2>&1 || true
          if ps-qa nodes > /tmp/isolated-probe.txt 2>&1; then
            ps-qa click "Enable inspection and agent control" \
              >> /tmp/isolated.txt 2>&1 || true
          fi
          disconnected=0
          for _ in $(seq 1 20); do
            if ! ps-qa nodes > /tmp/isolated-probe.txt 2>&1; then
              disconnected=1
              break
            fi
            sleep 0.5
          done
          if [ "$disconnected" -ne 1 ]; then
            echo "inspection toggle left the control socket reachable" >&2
            exit 1
          fi

      - name: Restart clean for the relaunch control
        if: ${{ inputs.cover }}
        run: |
          old_pid="$(cat /tmp/az-qa.pid)"
          kill -TERM "$old_pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            if ! kill -0 "$old_pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if kill -0 "$old_pid" 2>/dev/null; then kill -KILL "$old_pid"; fi

          scripts/qa-profile-restore.sh /tmp/qa-profile-db
          AZ_DATA_DIR=/tmp/qa-profile-db \
            ./target/debug/az-gui --blitz-control >> /tmp/az-qa.log 2>&1 &
          echo $! > /tmp/az-qa.pid
          for _ in $(seq 1 60); do
            ps-qa nodes > /tmp/restart-attach.txt 2>&1 && break
            sleep 2
          done
          ps-qa nodes > /tmp/restart-attach.txt 2>&1
          sleep 10

      - name: Verify Restart relaunches into a controllable process
        id: isolated_restart
        if: ${{ inputs.cover }}
        continue-on-error: true
        run: |
          old_pid="$(cat /tmp/az-qa.pid)"
          ps-qa click Settings
          sleep 2
          ps-qa click Restart > /tmp/restart.txt 2>&1 || true

          relaunched=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$old_pid" 2>/dev/null &&
               ps-qa tree > /tmp/restart-probe.txt 2>&1; then
              relaunched=1
              break
            fi
            sleep 2
          done
          if [ "$relaunched" -ne 1 ]; then
            echo "Restart did not replace audit pid $old_pid with a controllable instance" >&2
            exit 1
          fi

          new_pid="$(awk '$1 == "\"pid\":" { gsub(/,/, "", $2); print $2; exit }' /tmp/restart-probe.txt)"
          case "$new_pid" in
            ''|*[!0-9]*)
              echo "could not read the relaunched pid from ps-qa tree" >&2
              exit 1
              ;;
          esac
          if [ "$new_pid" = "$old_pid" ]; then
            echo "Restart kept the old pid $old_pid" >&2
            exit 1
          fi
          echo "$new_pid" > /tmp/az-qa.pid
          echo "Restart replaced pid $old_pid with pid $new_pid"

      # Collection continues past integrity faults so one macOS launch yields
      # all evidence, but a ghost tree can never receive a green verdict.
      - name: Enforce tree integrity
        if: ${{ steps.integrity.outcome == 'failure' }}
        run: exit 1

      # Collection continues through red outcomes so one expensive launch still
      # yields the full inventory, but the completed workflow must tell the
      # truth: a failed outcome check is a red audit.
      - name: Enforce outcome checks
        if: ${{ steps.checks.outcome == 'failure' }}
        run: exit 1

      - name: Enforce reachability inventory
        if: ${{ steps.inventory.outcome == 'failure' }}
        run: exit 1

      - name: Enforce semantic sweep
        if: ${{ steps.sweep.outcome == 'failure' }}
        run: exit 1

      - name: Enforce isolated controls
        if: ${{ steps.isolated.outcome == 'failure' }}
        run: exit 1

      - name: Enforce restart outcome
        if: ${{ steps.isolated_restart.outcome == 'failure' }}
        run: exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '## Panel checks'
            echo
            echo '```'
            tail -20 /tmp/qa.txt 2>/dev/null || echo 'the run produced no output'
            echo '```'
            if [ -f /tmp/cover.txt ]; then
              echo
              echo '## Coverage'
              echo
              echo '```'
              cat /tmp/cover.txt
              echo '```'
              echo
              echo '`manual` controls are excluded native dialogs and external destinations.'
              echo '`anonymous` controls lack an accessible name and fail semantic reachability.'
            fi
            if [ -f /tmp/sweep.txt ]; then
              echo
              echo '## Full semantic sweep'
              echo
              echo '```'
              tail -80 /tmp/sweep.txt
              echo '```'
            fi
            echo
            echo 'Full inventory: `tests/ps-qa/issues.md`.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Exact PID. Give the store ten seconds to flush after TERM, then stop a
      # genuinely wedged audit child without touching any other instance.
      - name: Stop the app
        if: always()
        run: |
          if [ -f /tmp/az-qa.pid ]; then
            audit_pid="$(cat /tmp/az-qa.pid)"
            kill -TERM "$audit_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$audit_pid" 2>/dev/null; then exit 0; fi
              sleep 0.5
            done
            kill -KILL "$audit_pid" 2>/dev/null || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-panel-logs
          path: |
            /tmp/az-qa.log
            /tmp/hidden-painted.txt
            /tmp/ghost.txt
            /tmp/qa.txt
            /tmp/cover.txt
            /tmp/sweep.txt
            /tmp/isolated.txt
            /tmp/isolated-probe.txt
            /tmp/restart.txt
            /tmp/restart-probe.txt
            /tmp/restart-attach.txt
          if-no-files-found: ignore
