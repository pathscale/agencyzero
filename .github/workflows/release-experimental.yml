name: Release Experimental

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the experimental version has not changed"
        type: boolean
        default: false

concurrency:
  group: release-experimental
  cancel-in-progress: false

env:
  CDN_DIR: agencyzero-experimental
  CDN_BASE: https://24x.ai/agencyzero-experimental
  BUNDLE_DIR: target/release/bundle/macos
  TARBALL: target/release/bundle/macos/AgencyZeroExperimental.app.tar.gz

jobs:
  check:
    runs-on: ubicloud-standard-2
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: One rev per git source
        # Cheaper to fail on this runner than twenty minutes into a macOS
        # bundle, which is the only build that resolves the renderer at all.
        run: scripts/check-one-rev-per-git-source.sh

      - name: Compare the committed version against the experimental channel
        id: decide
        run: |
          cargo generate-lockfile
          # `cargo pkgid` prints `<source>#<name>@<version>`; see release.yml.
          VERSION=$(cargo pkgid -p az-gui)
          VERSION=${VERSION##*@}
          case $VERSION in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::could not read the workspace version (got '$VERSION')"; exit 1;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          LIVE=$(curl -fsS --max-time 30 "$CDN_BASE/latest.json" 2>/dev/null \
            | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || echo "")

          if [ "${{ inputs.force }}" = "true" ] || [ "$LIVE" != "$VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: namespace-profile-agency-tahoe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agencyzero-macos-release
          cache-targets: true

      - name: Install frontend dependencies
        run: bun install --no-save
        working-directory: apps/gui/frontend

      # See the same step in release.yml: the crates.io build of the CLI the
      # npm package shims, so the release path never needs Node.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2.11"

      - name: Build the AgencyProxy sidecar
        run: scripts/stage-agency-proxy-sidecar.sh

      - name: Build experimental bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Diagnosable in the field, which is the point of this channel.
          #
          # A stripped binary profiles and crashes as `???`: the 2026-08-12 boot
          # crash cost two sessions to a backtrace naming a registry crate and
          # not one frame of ours, and the 76% idle spin was invisible until a
          # `sample` could name `mk_timer_arm` under our own event loop. Cargo
          # reads these from the environment and they reach the tauri wrapper,
          # so no manifest carries a debugging setting.
          #
          # `line-tables-only` rather than full debug info: it is what gives a
          # backtrace its file and line, without the DWARF that took a local
          # build from 61MB to 92MB, and this artifact ships through the updater.
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo tauri build --features experimental,blitz-inspector --config tauri.experimental.conf.json
        working-directory: apps/gui

      - name: Normalize updater artifact name
        run: |
          mv "$BUNDLE_DIR/AgencyZero Experimental.app.tar.gz" "$TARBALL"
          mv "$BUNDLE_DIR/AgencyZero Experimental.app.tar.gz.sig" "$TARBALL.sig"

      - name: Verify experimental identity and signature
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          APP="$BUNDLE_DIR/AgencyZero Experimental.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist")
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          test "$IDENTIFIER" = "com.pathscale.agencyzero.experimental"
          test "$BUILT" = "$VERSION"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "TeamIdentifier=not set"

      - name: Build experimental latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          test -f "$TARBALL"
          test -f "$TARBALL.sig"
          # Base64 signature, semver version: no JSON-escapable characters.
          # Guarded, same as release.yml.
          SIGNATURE=$(cat "$TARBALL.sig")
          case $SIGNATURE in *[!A-Za-z0-9+/=]*)
            echo "::error::signature is not plain base64; refusing to interpolate"; exit 1;; esac
          case $VERSION in *[!0-9A-Za-z.+-]*)
            echo "::error::version has unexpected characters; refusing to interpolate"; exit 1;; esac

          cat > latest-experimental.json <<JSON
          {
            "version": "$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIGNATURE",
                "url": "$CDN_BASE/AgencyZeroExperimental.app.tar.gz?v=$VERSION"
              }
            }
          }
          JSON

      - name: Upload experimental tarball
        env:
          STORAGE_API_KEY: ${{ secrets.BUNNYCDN_STORAGE_API_KEY }}
          STORAGE_NAME: ${{ secrets.BUNNYCDN_STORAGE_NAME }}
        run: |
          gunzip -t "$TARBALL"
          curl -sS -X DELETE -H "AccessKey: $STORAGE_API_KEY" \
            "https://storage.bunnycdn.com/$STORAGE_NAME/$CDN_DIR/AgencyZeroExperimental.app.tar.gz" || true
          curl -sS --fail-with-body -X PUT -H "AccessKey: $STORAGE_API_KEY" \
            -T "$TARBALL" \
            "https://storage.bunnycdn.com/$STORAGE_NAME/$CDN_DIR/AgencyZeroExperimental.app.tar.gz"

      - name: Purge and confirm the experimental tarball
        env:
          ZONE_API_KEY: ${{ secrets.BUNNYCDN_ZONE_API_KEY }}
          ZONE_ID: ${{ secrets.BUNNYCDN_ZONE_ID }}
        run: |
          curl -sS --fail-with-body -X POST -H "AccessKey: $ZONE_API_KEY" \
            "https://bunnycdn.com/api/pullzone/$ZONE_ID/purgeCache"
          LOCAL=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)
          for attempt in 1 2 3 4 5 6; do
            curl -sS -L -o edge-experimental.tar.gz "$CDN_BASE/AgencyZeroExperimental.app.tar.gz" || true
            REMOTE=$(shasum -a 256 edge-experimental.tar.gz | cut -d' ' -f1)
            if [ "$LOCAL" = "$REMOTE" ] && gunzip -t edge-experimental.tar.gz; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::experimental edge never served the new tarball"
          exit 1

      - name: Publish experimental latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
          STORAGE_API_KEY: ${{ secrets.BUNNYCDN_STORAGE_API_KEY }}
          STORAGE_NAME: ${{ secrets.BUNNYCDN_STORAGE_NAME }}
          ZONE_API_KEY: ${{ secrets.BUNNYCDN_ZONE_API_KEY }}
          ZONE_ID: ${{ secrets.BUNNYCDN_ZONE_ID }}
        run: |
          curl -sS -X DELETE -H "AccessKey: $STORAGE_API_KEY" \
            "https://storage.bunnycdn.com/$STORAGE_NAME/$CDN_DIR/latest.json" || true
          curl -sS --fail-with-body -X PUT -H "AccessKey: $STORAGE_API_KEY" \
            -T latest-experimental.json \
            "https://storage.bunnycdn.com/$STORAGE_NAME/$CDN_DIR/latest.json"
          curl -sS --fail-with-body -X POST -H "AccessKey: $ZONE_API_KEY" \
            "https://bunnycdn.com/api/pullzone/$ZONE_ID/purgeCache"

          for attempt in 1 2 3 4 5 6; do
            LIVE=$(curl -sS -L "$CDN_BASE/latest.json" \
              | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || echo "")
            if [ "$LIVE" = "$VERSION" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::experimental latest.json did not become visible"
          exit 1
