[package]
name = "az-gui"
description = "Tauri desktop harness for agencyzero"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
experimental = ["dep:agent-experimental"]
blitz-runtime = [
    "dep:blitz-dom",
    "dep:blitz-script",
    "dep:brotli",
    "dep:tauri-runtime-blitz",
    "dep:url",
]
blitz-inspector = ["blitz-runtime", "tauri-runtime-blitz/debug-control"]

[build-dependencies]
brotli = { version = "8.0.4", default-features = false, features = ["std"] }
tauri-build = { version = "2", features = [] }

[dependencies]
# Carries the store forward when a column changes; see crates/wt-migrate.
wt-migrate = { path = "../../crates/wt-migrate" }
agent-abstraction = "0.4.15"
agency-proxy-client = { git = "https://github.com/pathscale/agencyproxy.git", rev = "9926ab62a8b04711ab57fe4f8ef43bc15ebfb392" }
agency-proxy-protocol = { git = "https://github.com/pathscale/agencyproxy.git", rev = "9926ab62a8b04711ab57fe4f8ef43bc15ebfb392" }
agent-experimental = { git = "https://gitlab.com/anonymous-28282828282/agent-experimental.git", rev = "f04ee035d9f243eb0c2dadb03829f827bb87d918", default-features = false, optional = true }
promptsyntax = "0.1.0"
shlex = "1.3"
az-core.workspace = true
worktable = { git = "https://github.com/pathscale/WorkTable.git", rev = "7ab68d17c31e7dd3e56a364ffbb559dd0819b317" }
# The `worktable!` macro emits code that names these by bare path rather than
# through a re-export, so a consumer of the macro has to declare them too.
# Versions match worktable 1.0 beta's own, since a mismatch produces errors that name
# the wrong crate.
eyre = "0.6"
rkyv = { version = "0.8.9", features = ["uuid-1"] }
derive_more = { version = "2.0.1", features = ["from", "error", "display", "debug", "into"] }
futures = "0.3"
libc = "0.2"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "time"] }
tauri = { version = "2", features = [] }
tauri-runtime-blitz = { git = "https://github.com/pathscale/tauri-runtime-blitz.git", rev = "c3e2645f8ad34f246b0233eaaddc1e733aceae59", optional = true }
blitz-dom = { git = "https://github.com/pathscale/ps-blitz.git", rev = "30faf47191530dac80e4ddeec77174a41184a729", features = ["system-fonts"], optional = true }
blitz-script = { git = "https://github.com/pathscale/ps-blitz.git", rev = "30faf47191530dac80e4ddeec77174a41184a729", features = ["system-fonts"], optional = true }
brotli = { version = "8.0.4", default-features = false, features = ["std"], optional = true }
url = { version = "2.5.8", optional = true }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tauri-plugin-dialog = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[bin]]
name = "az-gui"
path = "src/main.rs"
