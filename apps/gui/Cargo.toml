[package]
name = "az-gui"
description = "Tauri desktop harness for agencyzero"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# No runtime by default, on purpose. This crate can host either, they are
# mutually exclusive, and a default meant that naming one still compiled the
# other: cargo features are additive, so `--features blitz-inspector` never
# removed the webview. Picking neither is now a compile error naming both,
# which is the failure a wrong build should have.
default = []
experimental = ["dep:agent-experimental"]
# Tauri's own runtime: a WKWebView on macOS.
#
# The `tauri` dependency is taken without default features precisely so this is
# a decision rather than a default. That set contains `wry`, so taking tauri
# plainly pulled the whole webview stack into every build, including the ones
# that render with Blitz and never call into it. The binary then declared a
# WebKit dependency it did not have, and a linker flag in `.cargo/config.toml`
# stripped the load command back out again. `apps/blitz-preview` and the chuzz
# workspace both already take tauri this way, and neither needs that flag.
webview-runtime = ["tauri/wry"]
blitz-runtime = [
    "dep:blitz-dom",
    "dep:blitz-script",
    "dep:brotli",
    "dep:tauri-runtime-blitz",
    "dep:url",
]
# Compile the full diagnostics capability into the binary. The engine-wide
# runtime setting still leaves its clocks, counters, maps, and sample stores
# dormant until the user explicitly enables deep profiling.
blitz-inspector = [
    "blitz-runtime",
    # `blitz-dom/log-phase-times` is deliberately absent.
    #
    # It enables `debug_timer/enable` inside blitz-dom, and the graph resolves
    # *two* crates called `debug_timer`: ps-blitz takes the fork
    # (`ps-debug-timer`) while `ps-anyrender-vello` takes the upstream crate of
    # the same name. Cargo unifies them by name, blitz-dom compiles against the
    # upstream one, and it has neither `log_line` nor `RealDebugTimer::init_if`:
    #
    #     error[E0425]: cannot find function `log_line` in crate `debug_timer`
    #     error[E0599]: no associated function named `init_if` found for `RealDebugTimer`
    #
    # chuzz builds because it never enables this feature. Nothing in this app
    # reads its output either - it is engine-internal phase timing, and the
    # numbers this app actually uses come from `tauri-runtime-blitz/diagnostics`
    # below, which is untouched. ps-anyrender#17 makes both repos name the fork;
    # this line can come back once that is published.
    "tauri-runtime-blitz/diagnostics",
]
# The lighter render pipeline, for measuring against the default Vello one.
blitz-hybrid = ["blitz-inspector", "tauri-runtime-blitz/hybrid-renderer"]

[build-dependencies]
brotli = { version = "8.0.4", default-features = false, features = ["std"] }
tauri-build = { version = "2", features = [] }

[dependencies]
# Carries the store forward when a column changes; see crates/wt-migrate.
wt-migrate = { path = "../../crates/wt-migrate" }
agent-abstraction = "0.4.15"
agency-proxy-client.workspace = true
agency-proxy-protocol.workspace = true
agent-experimental = { git = "https://gitlab.com/anonymous-28282828282/agent-experimental.git", branch = "master", default-features = false, optional = true }
promptsyntax = "0.1.0"
shlex = "1.3"
az-core.workspace = true
# Exact rather than a caret, unlike the engine deps above, and from the
# registry rather than a git rev. Master has moved on to an `arctic-wt` that
# cargo cannot select alongside this workspace, so tracking it fails to resolve
# rather than building something newer. beta.11 is published; moving to it is a
# storage-engine change and belongs in its own commit with its own testing, not
# in a dependency-source cleanup.
worktable = "=1.0.0-beta.10"
# The `worktable!` macro emits code that names these by bare path rather than
# through a re-export, so a consumer of the macro has to declare them too.
# Versions match worktable 1.0 beta's own, since a mismatch produces errors that name
# the wrong crate.
eyre = "0.6"
rkyv = { version = "0.8.9", features = ["uuid-1"] }
derive_more = { version = "2.0.1", features = ["from", "error", "display", "debug", "into"] }
futures = "0.3"
backon = { version = "1.6.0", default-features = false }
libc = "0.2"
dirs = "6"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "time"] }
# Default features are off; see `webview-runtime` for why.
tauri = { version = "2", default-features = false, features = ["macos-private-api", "compression"] }
# `macos-private-api` must match the `tauri` dependency above. Tauri's
# `WindowBuilder` trait declares `transparent` behind that feature, and the
# runtime gates its implementation behind the same one, so enabling it on only
# one side makes the trait demand a method the other side compiled out. As of
# 0.1.0 the runtime's own feature forwards to `tauri` and `tauri-runtime`, so
# naming it here agrees with that rather than being the only thing holding the
# two sides together.
tauri-runtime-blitz = { version = "^0.1.0", optional = true, features = ["macos-private-api"] }
#
# The engine by version, not by branch. Same move `chuzz` made, for the same
# reasons its manifest records.
#
# These carried a caret *and* a git branch, which is two sources of truth that
# nothing reconciles: the caret said `^0.3.0-beta.3` while the branch delivered
# whatever master happened to be, so the declared range documented nothing and
# the resolved crate depended on when anyone last fetched. It broke exactly as
# that predicts - `ps-blitz` moved to `ps-anyrender ^0.13.0`, this tree still
# resolved anyrender from crates.io at 0.12.0, and the build stopped at
# "failed to select a version".
#
# A caret is what was meant. `cargo update` moves it, `Cargo.lock` records what
# was resolved, and anything else asking for the same range gets the same crate
# rather than a second copy of the engine - which is the failure that reads as
# `expected ScriptDocument, found ScriptDocument` with both types naming one
# file. Working against a local checkout stays possible through the `[patch]`
# entries in `.cargo/config.toml`, so the default exercises what a release
# actually resolves.
blitz-dom = { package = "ps-blitz-dom", version = "^0.3.0-beta.6", features = ["system-fonts", "parallel-construct"], optional = true }
blitz-script = { package = "ps-blitz-script", version = "^0.3.0-beta.6", features = ["system-fonts"], optional = true }
brotli = { version = "8.0.4", default-features = false, features = ["std"], optional = true }
url = { version = "2.5.8", optional = true }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tauri-plugin-dialog = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[bin]]
name = "az-gui"
path = "src/main.rs"
