[package]
name = "az-gui"
description = "Tauri desktop harness for agencyzero"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
experimental = ["dep:agent-experimental"]
blitz-runtime = [
    "dep:blitz-dom",
    "dep:blitz-script",
    "dep:brotli",
    "dep:tauri-runtime-blitz",
    "dep:url",
]
# Per-frame phase timings belong here, not on the dependency line.
#
# On the base `blitz-dom` line they were compiled into every release build,
# which builds `--features blitz-runtime`. That is a `HashMap` entry per
# `compute_child_layout` (16,842 of them per keystroke, measured), a `Vec` of
# every distinct node sorted once a frame, and a `format!` plus a locked
# `stdout` write per frame — into a descriptor a Finder-launched bundle throws
# away.
#
# It also distorted what it measured. `note_computed` is called from inside
# `compute_child_layout`, so its cost is charged to the layout phase: the one
# phase that dominates every reading taken so far.
blitz-inspector = [
    "blitz-runtime",
    "dep:anyrender_vello",
    "blitz-dom/log-phase-times",
    "tauri-runtime-blitz/diagnostics",
]
# The lighter render pipeline, for measuring against the default Vello one.
blitz-hybrid = ["blitz-inspector", "tauri-runtime-blitz/hybrid-renderer"]

[build-dependencies]
brotli = { version = "8.0.4", default-features = false, features = ["std"] }
tauri-build = { version = "2", features = [] }

[dependencies]
# Carries the store forward when a column changes; see crates/wt-migrate.
wt-migrate = { path = "../../crates/wt-migrate" }
agent-abstraction = "0.4.15"
agency-proxy-client = "=0.1.6"
agency-proxy-protocol = "=0.1.6"
agent-experimental = { git = "https://gitlab.com/anonymous-28282828282/agent-experimental.git", rev = "afe3a70e02ef844a092385859ab8f5f3ab8a039e", default-features = false, optional = true }
promptsyntax = "0.1.0"
shlex = "1.3"
az-core.workspace = true
worktable = { git = "https://github.com/pathscale/WorkTable.git", rev = "7ab68d17c31e7dd3e56a364ffbb559dd0819b317" }
# The `worktable!` macro emits code that names these by bare path rather than
# through a re-export, so a consumer of the macro has to declare them too.
# Versions match worktable 1.0 beta's own, since a mismatch produces errors that name
# the wrong crate.
eyre = "0.6"
rkyv = { version = "0.8.9", features = ["uuid-1"] }
derive_more = { version = "2.0.1", features = ["from", "error", "display", "debug", "into"] }
futures = "0.3"
backon = { version = "1.6.0", default-features = false }
libc = "0.2"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "time"] }
tauri = { version = "2", features = [] }
tauri-runtime-blitz = { git = "https://github.com/pathscale/tauri-runtime-blitz.git", rev = "c908c37fd72d58939607def6a32015a301b8e8ad", optional = true }
blitz-dom = { package = "ps-blitz-dom", git = "https://github.com/pathscale/ps-blitz.git", rev = "4a825e548a387a3cb424b61c8db91f27d489b394", features = ["system-fonts"], optional = true }
blitz-script = { package = "ps-blitz-script", git = "https://github.com/pathscale/ps-blitz.git", rev = "4a825e548a387a3cb424b61c8db91f27d489b394", features = ["system-fonts"], optional = true }
# Named only to turn on its per-frame phase timer, which splits the one opaque
# "renderer" figure into scene encode, GPU submit and present. The renderer
# arrives through tauri-runtime-blitz, so a feature added anywhere in the
# ps-blitz workspace is never consulted on this path; cargo unifies features
# across the graph, so asking for it here is what reaches the copy actually
# built. Inspector-only: it prints a line per frame.
anyrender_vello = { package = "ps-anyrender-vello", version = "0.13.0", features = ["log_frame_times"], optional = true }
brotli = { version = "8.0.4", default-features = false, features = ["std"], optional = true }
url = { version = "2.5.8", optional = true }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tauri-plugin-dialog = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[bin]]
name = "az-gui"
path = "src/main.rs"
