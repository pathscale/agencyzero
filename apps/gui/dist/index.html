<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgencyZero</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #4f46e5;
      --card: #ffffff;
      --bg: #f4f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ececf0;
        --muted: #9a9aa5;
        --accent: #818cf8;
        --card: #1e1e24;
        --bg: #141418;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      background: var(--card);
      border-radius: 14px;
      padding: 2.5rem 3rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 30rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.7rem; }
    p.sub { margin: 0 0 1.5rem; color: var(--muted); }
    button {
      font: inherit;
      padding: 0.55rem 1.4rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    #reply { margin-top: 1.25rem; min-height: 1.4em; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>AgencyZero</h1>
    <p class="sub">Hello world from the Tauri GUI harness.</p>
    <button id="greet-btn">Call Rust</button>
    <p id="reply"></p>
  </main>
  <script>
    const { invoke } = window.__TAURI__.core;
    document.getElementById("greet-btn").addEventListener("click", async () => {
      document.getElementById("reply").textContent = await invoke("greet", { name: "world" });
    });
  </script>
</body>
</html>
