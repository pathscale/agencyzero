[package]
name = "agencyzero-blitz-preview"
description = "Native Blitz and Boa preview shell for the AgencyZero frontend"
version = "0.5.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
# `ps-anyrender`, not plain `anyrender`: ps-blitz-paint takes the ps- fork
# (`package = "ps-anyrender"`), and mixing the two put two copies of the
# `PaintScene` trait in the graph, so the vello-cpu painter could not satisfy
# the one blitz-paint asked for. That is what stopped the capture feature, and
# with it the only genuinely headless path, from building at all.
anyrender = { package = "ps-anyrender", version = "^0.13.0" }
anyrender_vello_cpu = { package = "ps-anyrender-vello-cpu", version = "^0.16.0", optional = true }
blitz-dom = { package = "ps-blitz-dom", version = "^0.3.0-beta.11", features = ["system-fonts"] }
blitz-paint = { package = "ps-blitz-paint", version = "^0.3.0-beta.11", features = ["scrollbars"] }
blitz-script = { package = "ps-blitz-script", version = "^0.3.0-beta.11", features = ["system-fonts"] }
blitz-traits = { package = "ps-blitz-traits", version = "^0.3.0-beta.11" }
brotli = { version = "^8.0.4", default-features = false, features = ["std"] }
png = { version = "^0.18.1", optional = true }
tauri = { version = "^2.11.5", default-features = false, features = ["compression"] }
tauri-runtime-blitz = { version = "^0.1.0", features = ["agent-control"] }
# The control bridge hands its answer back on a `tokio::sync::oneshot`,
# which is the type tauri-runtime-blitz names in `ControlBridge`. Only the
# channel is needed, so no runtime or reactor is pulled in.
tokio = { version = "^1", default-features = false, features = ["sync"] }
url = "^2.5.8"

# For `--offscreen`: the activation policy has to be set before any window
# exists, and Tauri only exposes it on a built app, by which point macOS has
# already activated the process and taken focus.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "^0.6"
objc2-app-kit = "^0.3"

[build-dependencies]
brotli = { version = "^8.0.4", default-features = false, features = ["std"] }
tauri-build = { version = "^2.6.3", features = [] }

[dev-dependencies]
usvg = "^0.46.0"

[features]
capture = ["dep:anyrender_vello_cpu", "dep:png"]
# Compiled in by default so `--blitz-control` is enough to drive this window
# with ps-qa. Without it the inspector answers every query with
# `diagnosticsUnavailable`, which reads as a broken harness rather than a
# missing feature. It is idle-cheap: the runtime flag still gates the work.
default = ["diagnostics"]
diagnostics = ["tauri-runtime-blitz/diagnostics"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace]
resolver = "3"

# Local checkout of tauri-runtime-blitz, for the headless inspection host.
#
# `AgentControlServer::start`, `inspect_document` and `click_agent_node` are
# exported on that branch (TRB#35) so this binary can serve the inspection
# socket without opening a window. Drop this once the change is published.
#
# This crate is not a member of the agencyzero workspace and has its own
# lockfile, so a patch in the root manifest does not reach it.
[patch.crates-io]
tauri-runtime-blitz = { path = "../../../tauri-runtime-blitz/crates/tauri-runtime-blitz" }
blitz-control-protocol = { path = "../../../tauri-runtime-blitz/crates/blitz-control-protocol" }
